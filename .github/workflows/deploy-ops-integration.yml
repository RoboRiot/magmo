name: Deploy Ops integration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-integration-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.invalid
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      OPS_ENVIRONMENT: ci
      OPS_INGEST_MODE: read_only
      OPS_DEPLOY_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:ops-integration
      - run: npm run build

  deploy-staging:
    if: inputs.target == 'staging'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm ci
      - name: Install protected staging runtime configuration
        shell: bash
        env:
          FIREBASE_RUNTIME_ENV: ${{ secrets.FIREBASE_RUNTIME_ENV }}
        run: |
          umask 077
          printf '%s\n' "$FIREBASE_RUNTIME_ENV" > functions/.env
          printf '%s\n' 'OPS_ENVIRONMENT=staging' 'OPS_INGEST_MODE=read_only' 'OPS_INGEST_WRITE_ENABLED=false' 'OPS_DEPLOY_VERSION=${{ github.sha }}' >> functions/.env
      - run: npm run firebase:build
      - run: npm install --global firebase-tools@15.1.0
      - run: firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only functions:nextServer,hosting
      - run: node scripts/verify-ops-deployment.mjs --base-url "${{ vars.OPS_BASE_URL }}" --environment staging --write-enabled false --version "${{ github.sha }}"

  deploy-production:
    if: inputs.target == 'production'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - run: npm ci
      - name: Install protected production runtime configuration
        shell: bash
        env:
          FIREBASE_RUNTIME_ENV: ${{ secrets.FIREBASE_RUNTIME_ENV }}
        run: |
          umask 077
          printf '%s\n' "$FIREBASE_RUNTIME_ENV" > functions/.env
          printf '%s\n' 'OPS_ENVIRONMENT=production' 'OPS_INGEST_MODE=read_write' 'OPS_INGEST_WRITE_ENABLED=true' 'OPS_DEPLOY_VERSION=${{ github.sha }}' >> functions/.env
      - run: npm run firebase:build
      - run: npm install --global firebase-tools@15.1.0
      - run: firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only functions:nextServer,hosting
      - run: node scripts/verify-ops-deployment.mjs --base-url "${{ vars.OPS_BASE_URL }}" --environment production --write-enabled true --version "${{ github.sha }}"
